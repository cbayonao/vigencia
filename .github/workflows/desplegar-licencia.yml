# Despliega el servicio de licencias (Lambda + API + DynamoDB) en producción
# cuando cambia licencia/** en main. Las claves de firma (.pem) nunca van a git.
# Secretos: AWS_ROLE_ARN, WOMPI_PUBLIC_KEY, WOMPI_PRIVATE_KEY,
# WOMPI_INTEGRITY_SECRET y opcional WOMPI_EVENTS_SECRET.
name: Desplegar servicio de licencias

on:
  push:
    branches: [main]
    paths: ["licencia/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15"
          terraform_wrapper: false
      # La llave de firma no va a git: se recupera de la Lambda desplegada
      # y vive solo en el runner (el apply la exige con precondición).
      - name: Recuperar llave de firma
        run: |
          mkdir -p licencia/claves
          aws lambda get-function-configuration --function-name vigencia-licencia \
            --query 'Environment.Variables.LICENCIA_PRIVADA_B64' --output text \
            | base64 -d > licencia/claves/licencia-privada.pem
          chmod 600 licencia/claves/licencia-privada.pem
          test -s licencia/claves/licencia-privada.pem
      - run: |
          cat > terraform.tfvars <<EOF
          wompi_env              = "prod"
          wompi_public_key       = "${{ secrets.WOMPI_PUBLIC_KEY }}"
          wompi_private_key      = "${{ secrets.WOMPI_PRIVATE_KEY }}"
          wompi_integrity_secret = "${{ secrets.WOMPI_INTEGRITY_SECRET }}"
          wompi_events_secret    = "${{ secrets.WOMPI_EVENTS_SECRET }}"
          EOF
        working-directory: licencia/terraform
      - run: terraform init -input=false && terraform apply -auto-approve -input=false
        working-directory: licencia/terraform
