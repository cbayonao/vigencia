# Al pushear un tag v* (ej. git tag v3.2.0 && git push origin v3.2.0):
# 1) arma los instaladores en su SO nativo, 2) crea el release de GitHub
# con esos artefactos, 3) los espeja a S3 con nombres estables, que son
# los que enlaza el landing (el repo es privado: sus releases no son
# descargables por el público). Requiere AWS_ROLE_ARN.
name: Publicar release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  crear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  armar:
    needs: crear
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            comando: dist:linux
          - os: windows-latest
            comando: dist:win
          - os: macos-latest
            comando: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
        working-directory: electron
      - run: npm run ${{ matrix.comando }}
        working-directory: electron
      # Subida directa al release (borrador): no usa la cuota de artefactos.
      - run: gh release upload "$TAG" electron/dist/Vigencia* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  espejar:
    needs: armar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: ./electron/script/publicar-descargas.sh "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      - run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
