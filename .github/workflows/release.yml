# Un solo camino para publicar: al pushear un tag v* (ej. git tag v3.2.0
# && git push origin v3.2.0) se arma cada instalador una sola vez en su SO
# nativo, se sube al release de GitHub (borrador), se espeja a S3 con
# nombres estables —los que enlaza el landing (el repo es privado: sus
# releases no son descargables por el público)— y se publica.
# Si un instalador falla (p. ej. el verificador del motor en rojo), el
# release queda en borrador y nada se publica: ese es el semáforo.
# Los tags se crean solo desde main verde (ver CI).
name: Publicar release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  armar:
    needs: crear
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            comando: dist:linux
          - os: windows-latest
            comando: dist:win
          - os: macos-latest
            comando: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
        working-directory: electron
      - run: npm run ${{ matrix.comando }}
        working-directory: electron
      # Subida directa al release (borrador). Sin cuota de artefactos y
      # re-ejecutable: --clobber reemplaza los archivos si ya existen.
      - run: gh release upload "$TAG" electron/dist/Vigencia* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  espejar:
    needs: armar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aws-auth
      - run: ./electron/script/publicar-descargas.sh "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      - run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
